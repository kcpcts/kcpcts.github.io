<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Krish Chauhan</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=phone_iphone" />
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-content">
                <ul class="nav-links">
                    <li><a href="index.html">home</a></li>
                    <li><a href="about.html">about</a></li>
                    <li><a href="resume.html">résumé</a></li>
                    <li><a href="projects.html">projects</a></li>
                    <li><a href="contact.html" class="active">contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="contact-container">
            <div class="contact-form-wrapper" id="form-wrapper">
                <div class="form-header">
                    <h1>get in touch</h1>
                    <p>fill out the form below to send me a message</p>
                </div>
                <div class="form-content">
                    <form action="https://api.web3forms.com/submit" method="POST" id="form">
                        <input type="hidden" name="access_key" value="d40efa9d-e1d2-4921-a2ac-eb175003251a" />
                        <input type="hidden" name="subject" value="New Contact Form Submission" />
                        <input type="checkbox" name="botcheck" style="display: none;" />

                        <div class="form-group">
                            <label for="name">what's your name?</label>
                            <input type="text" name="name" id="name" placeholder="John Doe" required />
                        </div>

                        <div class="form-group">
                            <label for="email">what's your email?</label>
                            <input type="email" name="email" id="email" placeholder="you@example.com" required />
                        </div>

                        <div class="form-group">
                            <label for="phone">
                                <span style="margin-right: -0.2rem;" class="material-symbols-outlined">phone_iphone</span>
                                # ?
                            </label>
                            <input type="tel" name="phone" id="phone" placeholder="+1 (555) 1234-567" required />
                        </div>

                        <div class="form-group">
                            <label for="message">your message</label>
                            <textarea rows="5" name="message" id="message" placeholder="let me know..." required></textarea>
                        </div>

                        <div class="form-group">
                            <button type="submit">slide</button>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="result-card" id="result-card">
                <p class="form-result" id="result"></p>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://github.com/kcpcts" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://www.linkedin.com/in/krishchauhan06/" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-linkedin"></i>
            </a>
        </div>
        <p>&copy; 2024 Krish Chauhan. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
